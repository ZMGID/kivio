[package]
name = "kivio-agent-sdk"
version = "0.1.0-alpha.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Host-independent agent runtime with Chat, Responses, Anthropic and Gemini providers"

[features]
default = []
skills = []
mcp = ["dep:rmcp", "dep:process-wrap", "dep:base64", "dep:libc", "dep:sha2", "tokio/process", "tokio/io-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
schemars = "1.2.2"
jsonschema = { version = "0.60.2", default-features = false }
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
process-wrap = { version = "10.0.1", features = ["tokio1"], optional = true }
rmcp = { version = "=3.9.0", default-features = false, optional = true, features = [
    "client", "client-side-sse", "reqwest", "transport-child-process",
    "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "which-command",
] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }
