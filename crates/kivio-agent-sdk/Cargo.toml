[package]
name = "kivio-agent-sdk"
version = "0.1.0-alpha.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Host-independent agent runtime with Chat, Responses, Anthropic and Gemini providers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
schemars = "1.2.2"
jsonschema = { version = "0.60.2", default-features = false }
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }
