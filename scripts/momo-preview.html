<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨墨 · 体积与动作</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d1d1f;background:#fdfcfa;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:40px 56px;max-width:1280px;margin-inline:auto}h1{font-size:26px;font-weight:550;letter-spacing:-.03em;margin:0 0 10px}p{font-size:14px;line-height:1.65;color:#68686c;margin:0}header{display:flex;justify-content:space-between;align-items:start;margin-bottom:30px}button,select{font:inherit;font-size:13px;border:1px solid #d8d8df;background:transparent;border-radius:7px;padding:7px 12px;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid #2f6ff0;outline-offset:4px}button[aria-pressed=true]{background:#e6efff;border-color:#86aafa;color:#245ac5}.stage{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-bottom:28px;border-bottom:1px solid #dedee3}.actor{height:268px;display:flex;align-items:center;justify-content:center}.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.details{padding-top:35px}.details h2{font-size:18px;margin:0 0 12px;font-weight:550}.sizes{display:flex;align-items:center;gap:24px;margin:24px 0}.size{display:flex;align-items:center;gap:8px;font-size:12px;color:#777}.views{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:30px}.view{text-align:center;font-size:12px;color:#68686c}.view svg{display:block;width:100%;max-width:160px;height:auto;margin:auto}.shapes{display:flex;gap:8px;align-items:center;margin-top:24px;font-size:13px}.dark{color:#f0f0f3;background:#212121;color-scheme:dark}.dark p,.dark .view{color:#b0b0ba}.dark button,.dark select{border-color:#4e4e56}.dark button[aria-pressed=true]{background:#2a3243;color:#a9c3ff}.dark .stage{border-color:#414147}.note{margin-top:24px;font-size:12px}svg{overflow:visible}[role=button]{display:inline-flex;cursor:pointer;touch-action:manipulation;user-select:none}@media(max-width:750px){body{padding:24px}.stage{grid-template-columns:1fr;gap:0}.details{padding-top:0}.views{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div id="root"></div><script type="module">
import React, {useState,useRef} from 'react'
import {createRoot} from 'react-dom/client'
import {KivioBlob} from '/src/chat/KivioBlob.tsx'
import {useEmptyHeroJab,useEmptyHeroLine} from '/src/chat/emptyHero.ts'
import {bodyPoints,facePoints} from '/src/chat/kivioBlobShapes.ts'
import {projectBlobVolume} from '/src/chat/kivioBlobVolume.ts'
const h=React.createElement
const states=[['idle','空闲'],['think','思考'],['search','搜索'],['work','工作'],['speak','回答'],['wait','等待'],['done','完成'],['error','出错']]
function Pose({yaw,pitch,label,shape,index}){
 const p=projectBlobVolume(bodyPoints(shape),facePoints('neutral'),{yaw,pitch,squash:1});const id='view-'+index
 return h('div',{className:'view'},h('svg',{viewBox:'0 0 240 240','aria-label':label},h('defs',null,h('clipPath',{id},h('path',{d:p.bodyD}))),h('path',{d:p.bodyD,fill:'#1d6bf0'}),h('g',{clipPath:`url(#${id})`},...p.eyes.map((d,i)=>h('path',{key:i,d,fill:'#f3efe6'})))),label)
}
function App(){
 const [mood,setMood]=useState('idle'),[shape,setShape]=useState('circle'),[dark,setDark]=useState(false);const ref=useRef(null);const {jab,onPoke}=useEmptyHeroJab('zh');const greeting=useEmptyHeroLine({lang:'zh',active:!jab})

  h('header',null,h('div',null,h('h1',null,'和墨墨待一会儿'),h('p',null,'会发呆，也会认真听你说。')),h('button',{onClick:()=>{document.documentElement.classList.toggle('dark',!dark);setDark(!dark)}},dark?'浅色背景':'深色背景')),
  h('section',{className:'stage'},h('div',null,h('div',{className:'actor','data-momo-region':true},h(KivioBlob,{size:220,mood,ref,onPoke})),h('div',{className:'controls'},...states.map(([value,label])=>h('button',{key:value,'aria-pressed':mood===value,onClick:()=>setMood(value)},label)))),
   h('div',{className:'details'},h('h2',null,jab??greeting),h('p',null,'不用急着开口。墨墨会看看四周，偶尔眨眨眼。把鼠标移近一点，或轻轻戳它一下，看看它怎么回应。'),h('div',{className:'sizes'},h('div',{className:'size'},h(KivioBlob,{size:28,mood}),'状态行 28'),h('div',{className:'size'},h(KivioBlob,{size:56,mood}),'聊天页 56')),h('button',{onClick:()=>ref.current?.pokeAt()},'戳一下'),h('p',{className:'note'},'试试切换不同状态，看看忙起来的墨墨。连续轻戳，也会收到不同的回应。'))),
  h('div',{className:'shapes'},h('label',{htmlFor:'shape'},'换个样子'),h('select',{id:'shape',value:shape,onChange:e=>setShape(e.target.value)},... [['circle','软球'],['squircle','圆角方体'],['puddle','压扁'],['cloud','云团'],['bubble','气泡']].map(([v,l])=>h('option',{value:v,key:v},l)))),
  h('section',{className:'views'},...[[0,0,'正面'],[-.8,0,'左转'],[.8,0,'右转'],[.7,.55,'右上转'],[1.55,.1,'转到侧面']].map(([yaw,pitch,label],index)=>h(Pose,{yaw,pitch,label,shape,index,key:index}))),
  h('p',{className:'note'},'互动预览 · 最高 60fps，休息时停帧 · 不会发送聊天消息'))
}
createRoot(document.getElementById('root')).render(h(App))
</script></body></html>
