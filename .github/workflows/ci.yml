name: CI

on:
  workflow_call:
    inputs:
      sha:
        description: Commit verified and built by the release workflow
        type: string
        required: true
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - id: dependencies
        run: npm ci
      - run: npm test
      - name: Vite and CLI bridge tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test scripts/vite-watch.test.mjs scripts/pi-mcp.test.mjs scripts/dsh-bridge.test.mjs

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser

  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run models:check && node --test scripts/model-database.test.mjs
      - run: npm run icons:check
      - run: npm run package:check && npm run test:packaging
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run build:swift
      - run: npm run lint
      - run: npm run architecture:check
      - run: npm run typecheck
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run build:word
      - id: sidecar
        run: npm run build:swift
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Antigravity recovery across desktop restarts
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.sidecar.outcome == 'success' }}
        shell: bash
        run: |
          TAURI_CONFIG="$(cat src-tauri/tauri.test.conf.json)" cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bin kivio
          python3 scripts/probe-antigravity-recovery.py src-tauri/target/debug/kivio
      - name: Rust Clippy
        if: ${{ !cancelled() && steps.sidecar.outcome == 'success' }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets
