name: Agent SDK

on:
  pull_request:
    paths:
      - 'crates/kivio-agent-sdk/**'
      - 'tests/fixtures/agent-sdk-consumer/**'
      - 'scripts/check-agent-sdk*'
      - '.github/workflows/agent-sdk.yml'
      - 'LICENSE'
  push:
    branches:
      - main
    paths:
      - 'crates/kivio-agent-sdk/**'
      - 'tests/fixtures/agent-sdk-consumer/**'
      - 'scripts/check-agent-sdk*'
      - '.github/workflows/agent-sdk.yml'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/kivio-agent-sdk -> target
            tests/fixtures/agent-sdk-consumer -> target
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check SDK boundaries
        run: |
          python scripts/check-agent-sdk.test.py
          python scripts/check-agent-sdk.py

      - name: Check formatting
        run: |
          cargo fmt --manifest-path crates/kivio-agent-sdk/Cargo.toml --all -- --check
          cargo fmt --manifest-path tests/fixtures/agent-sdk-consumer/Cargo.toml --all -- --check

      - name: Test SDK
        run: |
          cargo test --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml
          cargo test --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml --all-features

      - name: Check examples
        run: cargo check --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml --examples --all-features

      - name: Run offline examples
        run: |
          cargo run --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml --example agent -- minimal
          cargo run --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml --example agent -- cancel
          cargo run --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml --example agent -- inputs
          cargo run --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml --example agent -- continue
          cargo run --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml --example session_offline --all-features

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml --no-deps --all-features

      - name: Test independent consumer
        run: cargo test --locked --manifest-path tests/fixtures/agent-sdk-consumer/Cargo.toml

      - name: Verify distributable package
        run: |
          cargo package --locked --manifest-path crates/kivio-agent-sdk/Cargo.toml
          python scripts/check-agent-sdk.py --package crates/kivio-agent-sdk/target/package/kivio-agent-sdk-*.crate --test-consumer
