name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (e.g. v2.9.0)'
        required: true
      ref:
        description: 'Optional branch/tag/commit to verify against the release tag'
        required: false
        default: ''

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || format('refs/tags/{0}', inputs.tag)) || github.sha }}
      - id: resolve
        name: Verify build commit against the release tag
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse HEAD)
          if [[ "$sha" != "$(git rev-parse 'FETCH_HEAD^{commit}')" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not point to the selected commit $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  ci:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  sdk:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/agent-sdk.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  model-database:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve and validate latest compatible model database once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/model-database"
          if ! node scripts/model-database.mjs --output "$RUNNER_TEMP/model-database/modelDatabase.json"; then
            echo "::warning::Online model database is unavailable or incompatible; using the validated snapshot from the release commit."
            node scripts/model-database.mjs --check
            cp src/data/modelDatabase.json "$RUNNER_TEMP/model-database/modelDatabase.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-model-database
          path: ${{ runner.temp }}/model-database/
          if-no-files-found: error

  create-release:
    needs: [source, ci, sdk, model-database]
    env:
      BUILD_REF: ${{ needs.source.outputs.sha }}
    # Both platform jobs upload their verified installers into this release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$BUILD_REF" ]]; then
            echo "::error::Release tag moved during validation. Run the workflow on its new commit."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          extra=()
          case "$RELEASE_TAG" in
            *beta*|*alpha*|*rc*) extra+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kivio Desktop $RELEASE_TAG" \
            --notes "Automated macOS (Apple Silicon) + Windows (x64 installer and portable zip) build for ${RELEASE_TAG}. Built from: ${BUILD_REF}." \
            --verify-tag \
            "${extra[@]}"

  tauri-release:
    needs: [source, create-release, model-database]
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Use the same model database snapshot on every platform
        uses: actions/download-artifact@v4
        with:
          name: release-model-database
          path: src/data/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate bundled model database
        run: node scripts/model-database.mjs --check

      - name: Check application icons
        run: npm run icons:check

      - name: Check desktop package version and resources
        shell: bash
        run: npm run package:check -- --version "$RELEASE_TAG"

      - name: Test desktop packaging checks
        run: npm run test:packaging

      - name: Build Swift sidecar
        # macOS: real kivio-ocr-helper. Windows: empty stub for externalBin.
        run: npm run build:swift

      - name: Build macOS installer
        if: matrix.platform == 'macos-latest'
        run: npx tauri build --bundles dmg

      - name: Build Windows installer
        if: matrix.platform == 'windows-latest'
        run: npx tauri build --bundles nsis

      - name: Verify signature and resources in macOS DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          mount_dir=$(mktemp -d)
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir"; rmdir "$mount_dir"' EXIT
          resources="$mount_dir/Kivio Desktop.app/Contents/Resources"
          node scripts/check-desktop-package.mjs --resources-dir "$resources" --macos-app "$mount_dir/Kivio Desktop.app"

      - name: Publish verified macOS installer
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify bundled resources in Windows installer
        id: windows-installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $inspectDir = Join-Path $env:RUNNER_TEMP ('kivio-installer-check-' + [guid]::NewGuid().ToString('n'))
          & 'C:/Program Files/7-Zip/7z.exe' x $installer.FullName "-o$inspectDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract NSIS installer' }
          $skillsDir = Get-ChildItem -LiteralPath $inspectDir -Directory -Recurse -Filter 'skills' |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.Parent.FullName 'licenses') -PathType Container } |
            Select-Object -First 1
          if (-not $skillsDir) { throw 'Installer resource directory missing' }
          & node scripts/check-desktop-package.mjs --resources-dir $skillsDir.Parent.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer resources do not match the source.' }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Package portable zip and upload verified Windows artifacts
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_INSTALLER: ${{ steps.windows-installer.outputs.path }}
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart('v')
          & ./scripts/package-windows-portable.ps1 -Version $ver
          $zip = "src-tauri/target/release/bundle/portable/Kivio.Desktop_${ver}_x64-portable.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "portable zip not found: $zip" }
          gh release upload $env:RELEASE_TAG $env:VERIFIED_INSTALLER $zip --clobber --repo $env:GITHUB_REPOSITORY
