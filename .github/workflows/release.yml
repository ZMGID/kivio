name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (e.g. v2.9.0)'
        required: true
        default: 'v2.9.4'
      ref:
        description: 'Git ref to build from (branch/tag/commit)'
        required: true
        default: 'main'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

jobs:
  model-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve and validate latest compatible model database once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/model-database"
          if ! node scripts/model-database.mjs --output "$RUNNER_TEMP/model-database/modelDatabase.json"; then
            echo "::warning::Online model database is unavailable or incompatible; using the validated snapshot from $BUILD_REF."
            node scripts/model-database.mjs --check
            cp src/data/modelDatabase.json "$RUNNER_TEMP/model-database/modelDatabase.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-model-database
          path: ${{ runner.temp }}/model-database/
          if-no-files-found: error

  create-release:
    needs: model-database
    # Both platform jobs upload into this release. Creating it first avoids a
    # race where two tauri-action steps try to open the same tag.
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          extra=()
          case "$RELEASE_TAG" in
            *beta*|*alpha*|*rc*) extra+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kivio Desktop $RELEASE_TAG" \
            --notes "Automated macOS (Apple Silicon) + Windows (x64 installer and portable zip) build for ${RELEASE_TAG}. Built from: ${BUILD_REF}." \
            --verify-tag \
            "${extra[@]}"

  tauri-release:
    needs: [create-release, model-database]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon; the DMG name stays *_aarch64.dmg.
          - platform: macos-latest
            name: macOS
            args: --bundles dmg
          - platform: windows-latest
            name: Windows
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Use the same model database snapshot on every platform
        uses: actions/download-artifact@v4
        with:
          name: release-model-database
          path: src/data/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate bundled model database
        run: node scripts/model-database.mjs --check

      - name: Check application icons
        run: npm run icons:check

      - name: Check desktop package version and resources
        shell: bash
        run: npm run package:check -- --version "$RELEASE_TAG"

      - name: Test desktop packaging checks
        run: npm run test:packaging

      - name: Build Swift sidecar
        # macOS: real kivio-ocr-helper. Windows: empty stub for externalBin.
        run: npm run build:swift

      - name: Build macOS installer
        if: matrix.platform == 'macos-latest'
        run: npx tauri build --bundles dmg

      - name: Build and publish Windows installer
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Kivio Desktop ${{ env.RELEASE_TAG }}
          releaseBody: |
            Automated macOS (Apple Silicon / aarch64, ad-hoc signed) + Windows (x64) build for ${{ env.RELEASE_TAG }}.
            Built from: ${{ env.BUILD_REF }}
            - macOS: DMG (ad-hoc signed, not notarized; permissions may need to be granted again after an update)
            - Windows: NSIS installer (.exe) and portable zip (unzip and run)
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'rc') }}
          includeUpdaterJson: false
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Verify signature and resources in macOS DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          mount_dir=$(mktemp -d)
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir"; rmdir "$mount_dir"' EXIT
          resources="$mount_dir/Kivio Desktop.app/Contents/Resources"
          node scripts/check-desktop-package.mjs --resources-dir "$resources" --macos-app "$mount_dir/Kivio Desktop.app"

      - name: Publish verified macOS installer
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify bundled resources in Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $inspectDir = Join-Path $env:RUNNER_TEMP ('kivio-installer-check-' + [guid]::NewGuid().ToString('n'))
          & 'C:/Program Files/7-Zip/7z.exe' x $installer.FullName "-o$inspectDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract NSIS installer' }
          $skillsDir = Get-ChildItem -LiteralPath $inspectDir -Directory -Recurse -Filter 'skills' |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.Parent.FullName 'licenses') -PathType Container } |
            Select-Object -First 1
          if (-not $skillsDir) { throw 'Installer resource directory missing' }
          & node scripts/check-desktop-package.mjs --resources-dir $skillsDir.Parent.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer resources do not match the source.' }

      - name: Package and upload Windows portable zip
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart('v')
          & ./scripts/package-windows-portable.ps1 -Version $ver
          $zip = "src-tauri/target/release/bundle/portable/Kivio.Desktop_${ver}_x64-portable.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "portable zip not found: $zip" }
          gh release upload $env:RELEASE_TAG $zip --clobber --repo $env:GITHUB_REPOSITORY
