[package]
name = "kivio-ocr-worker"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Separate workspace: OCR's verified runtime ABI is independent of voice's.
[workspace]

[dependencies]
oar-ocr = { version = "=0.8.0", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "rt"] }
reqwest = { version = "=0.13.4", features = ["rustls", "stream"] }
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_LibraryLoader"] }

[profile.dev]
debug = 1
