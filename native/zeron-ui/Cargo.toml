[package]
name = "zeron-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
voice-experimental = [] # Compatibility flag; native subscription voice uses Codex's packaged helper.
project-palette-fixture = []
compact-picker-fixture = ["gpui-kit/test-support"]

# Native captures explicitly present the freshly drawn scene, including when
# a nested Wayland compositor has stopped requesting idle frames.
browser-fixture = ["gpui-kit/test-support"]
windows-render-fixture = []
appshots-fixture = ["gpui-kit/test-support"]
pull-request-fixture = ["gpui-kit/test-support"]
resource-profile = ["gpui-kit/test-support", "gpui-kit/test-support"]

[[example]]
name = "macos-resource-profile"
required-features = ["resource-profile"]

[[example]]
name = "preview-fixture"
required-features = ["browser-fixture"]

[[example]]
name = "browser-fixture"
required-features = ["browser-fixture"]

[[example]]
name = "windows-render-fixture"
required-features = ["windows-render-fixture"]

[[example]]
name = "appshots-fixture"
required-features = ["appshots-fixture"]

[[example]]
name = "program-status-fixture"
required-features = ["appshots-fixture", "resource-profile"]

[[example]]
name = "tool-images-fixture"
required-features = ["appshots-fixture"]

[[example]]
name = "pull-request-fixture"
required-features = ["pull-request-fixture"]

[[example]]
name = "new-project-fixture"
required-features = ["project-palette-fixture"]

[[example]]
name = "sidebar-fixture"
required-features = ["project-palette-fixture"]

[[example]]
name = "compact-picker-fixture"
required-features = ["compact-picker-fixture"]

[dependencies]
global-hotkey = "=0.7.0"
tempfile.workspace = true
async-channel = "2"
kivio-model-runtime = { path = "../model-runtime" }
zeron-voice-media.workspace = true
zeron-voice-session.workspace = true
zeron-orb.workspace = true
zeron-veil.workspace = true
zeron-voice.workspace = true
url = "2"
zeron-proto.workspace = true
similar.workspace = true
zeron-doc.workspace = true
zeron-engine.workspace = true
zeron-harness.workspace = true
zeron-rpc.workspace = true
zeron-update.workspace = true
zeron-notify.workspace = true
zeron-syntax.workspace = true
zeron-theme.workspace = true
zeron-visual.workspace = true
zeron-visual-gpu.workspace = true
gpui-kit.workspace = true
gpui_tokio.workspace = true
tokio-util.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
zeron-markdown.workspace = true
zatex = { workspace = true, features = ["bundled"] }
html5ever = "0.39"
alacritty_terminal.workspace = true
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
usvg = "0.46"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
unicode-segmentation.workspace = true
unicode-width.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
roxmltree = "0.21.1"
png = "0.18"
thiserror.workspace = true
rust-embed = "=8.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "=0.21.3"
libc.workspace = true
objc = "0.2"
raw-window-handle = "0.6"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSHapticFeedback", "NSBitmapImageRep", "NSImage", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = "0.3.2"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan", "highsierra", "link"] }
foreign-types = "0.5"
block = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "screenshot", "settings"] }
atspi = { version = "0.30.0", features = ["zbus"] }
async-io = "2"
url = "2"
x11rb = { version = "0.14.0", features = ["image"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
mimalloc.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = "=0.21.3"
# Embedded browser: WebView2 in visual-hosting mode, composited by the zui
# overlay plane. Same windows 0.61 as gpui_windows, so COM types interoperate.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectComposition", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
raw-window-handle = "0.6"
reqwest.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
